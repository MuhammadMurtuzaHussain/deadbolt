[package]
name = "deadbolt"
version = "0.1.0"
edition = "2021"
description = "On-chain spend policy for AI agent vaults, with a pay-per-prompt red-team arena."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "deadbolt"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.2.2"
